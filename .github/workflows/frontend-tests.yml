name: Application CI

on:
  push:
    branches:
      - main
      - dev
      - staging
      - prod

  pull_request:
    branches:
      - main
      - dev
      - staging
      - prod

jobs:

  # ============================================================
  # FRONTEND TESTS
  # ============================================================
  frontend-tests:
    name: Frontend - Vitest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build


  # ============================================================
  # BACKEND TESTS
  # ============================================================
  backend-tests:
    name: Backend - Jest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test


  # ============================================================
  # DOCKER BUILD
  # ============================================================
  docker-builds:
    name: Docker Builds
    runs-on: ubuntu-latest

    needs:
      - frontend-tests
      - backend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: |
          docker build \
            -t fullstack-devops-portfolio-frontend:ci \
            ./frontend

      - name: Build backend Docker image
        run: |
          docker build \
            -t fullstack-devops-portfolio-backend:ci \
            ./backend

      - name: Show Docker images
        run: docker images


  # ============================================================
  # DOCKER CONTAINER SMOKE TESTS
  # ============================================================
  docker-smoke-tests:
    name: Docker Smoke Tests
    runs-on: ubuntu-latest

    needs:
      - docker-builds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Build images again
      # --------------------------------------------------------
      # Each GitHub Actions job runs on a fresh runner.
      # Therefore the images from docker-builds are not available
      # here and must be rebuilt.
      # --------------------------------------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t fullstack-devops-portfolio-frontend:ci \
            ./frontend

      - name: Build backend image
        run: |
          docker build \
            -t fullstack-devops-portfolio-backend:ci \
            ./backend


      # ========================================================
      # INVESTIGATE BACKEND PRODUCTION IMAGE
      # ========================================================
      - name: Inspect backend production dependencies
        run: |
          docker run --rm \
            fullstack-devops-portfolio-backend:ci \
            sh -c '
              echo "=============================================="
              echo "BACKEND PRODUCTION IMAGE INSPECTION"
              echo "=============================================="

              echo ""
              echo "=== Checking /app/node_modules ==="

              if [ -d /app/node_modules ]; then
                echo "node_modules exists"
              else
                echo "ERROR: /app/node_modules does not exist"
                exit 1
              fi

              echo ""
              echo "=== Checking Jest ==="

              if [ -d /app/node_modules/jest ]; then
                echo "WARNING: Jest IS inside production image"
              else
                echo "OK: Jest is NOT inside production image"
              fi

              echo ""
              echo "=== Checking vulnerable packages ==="

              for pkg in brace-expansion picomatch ip-address sigstore tar; do
                if [ -d "/app/node_modules/$pkg" ]; then
                  echo "FOUND: $pkg"
                else
                  echo "NOT FOUND: $pkg"
                fi
              done

              echo ""
              echo "=== Production dependency tree ==="

              npm ls --omit=dev --depth=0 || true

              echo ""
              echo "=============================================="
              echo "END BACKEND PRODUCTION IMAGE INSPECTION"
              echo "=============================================="
            '


      # ========================================================
      # FRONTEND CONTAINER
      # ========================================================
      - name: Run frontend container
        run: |
          docker run -d \
            --name frontend-smoke \
            -p 8080:80 \
            fullstack-devops-portfolio-frontend:ci

      - name: Wait for frontend
        run: sleep 5

      - name: Smoke test frontend
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 2 \
            http://localhost:8080

      - name: Remove frontend container
        if: always()
        run: |
          docker rm -f frontend-smoke || true


      # ========================================================
      # BACKEND CONTAINER
      # ========================================================
      - name: Run backend container
        run: |
          docker run -d \
            --name backend-smoke \
            -p 5000:5000 \
            fullstack-devops-portfolio-backend:ci

      - name: Wait for backend
        run: sleep 5

      - name: Smoke test backend
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 2 \
            http://localhost:5000/

      - name: Remove backend container
        if: always()
        run: |
          docker rm -f backend-smoke || true


  # ============================================================
  # DOCKER SECURITY SCANNING
  # ============================================================
  docker-security-scan:
    name: Trivy Docker Security Scan
    runs-on: ubuntu-latest

    needs:
      - docker-smoke-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Build frontend image
      # --------------------------------------------------------
      - name: Build frontend image
        run: |
          docker build \
            -t fullstack-devops-portfolio-frontend:scan \
            ./frontend

      # --------------------------------------------------------
      # Build backend image
      # --------------------------------------------------------
      - name: Build backend image
        run: |
          docker build \
            -t fullstack-devops-portfolio-backend:scan \
            ./backend


      # ========================================================
      # TRIVY - FRONTEND
      # ========================================================
      - name: Scan frontend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fullstack-devops-portfolio-frontend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1


      # ========================================================
      # TRIVY - BACKEND
      # ========================================================
      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fullstack-devops-portfolio-backend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          format: json
          output: trivy-backend.json

      - name: Inspect Trivy backend JSON
        if: always()
        run: |
          echo "=== Trivy backend JSON ==="
          cat trivy-backend.json
