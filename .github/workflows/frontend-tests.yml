name: Application CI

on:
  push:
    branches:
      - main
      - dev
      - staging
      - prod

  pull_request:
    branches:
      - main
      - dev
      - staging
      - prod

jobs:

  # ============================================================
  # FRONTEND TESTS
  # ============================================================
  frontend-tests:
    name: Frontend - Vitest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build


  # ============================================================
  # BACKEND TESTS
  # ============================================================
  backend-tests:
    name: Backend - Jest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test


  # ============================================================
  # DOCKER BUILD
  # ============================================================
  docker-builds:
    name: Docker Builds
    runs-on: ubuntu-latest

    needs:
      - frontend-tests
      - backend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: |
          docker build \
            -t fullstack-devops-portfolio-frontend:ci \
            ./frontend

      - name: Build backend Docker image
        run: |
          docker build \
            -t fullstack-devops-portfolio-backend:ci \
            ./backend

      - name: Show Docker images
        run: docker images


  # ============================================================
  # DOCKER CONTAINER SMOKE TESTS
  # ============================================================
  docker-smoke-tests:
    name: Docker Smoke Tests
    runs-on: ubuntu-latest

    needs:
      - docker-builds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Build images again
      # --------------------------------------------------------
      # Each GitHub Actions job runs on a fresh runner.
      # Therefore images from docker-builds are not available here.
      # --------------------------------------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t fullstack-devops-portfolio-frontend:ci \
            ./frontend

      - name: Build backend image
        run: |
          docker build \
            -t fullstack-devops-portfolio-backend:ci \
            ./backend


      # ========================================================
      # INVESTIGATE BACKEND PRODUCTION IMAGE
      # ========================================================
      - name: Locate vulnerable packages in production image
        run: |
          docker run --rm \
            fullstack-devops-portfolio-backend:ci \
            sh -c '
              echo "=============================================="
              echo "FULL IMAGE PACKAGE LOCATION INVESTIGATION"
              echo "=============================================="

              for pkg in brace-expansion picomatch ip-address sigstore tar; do
                echo ""
                echo "=== $pkg ==="

                find / \
                  -type d \
                  -path "*/node_modules/$pkg" \
                  2>/dev/null || true
              done

              echo ""
              echo "=== npm installation ==="
              npm --version
              which npm
              npm root -g

              echo ""
              echo "=== Node installation ==="
              which node
              node --version

              echo ""
              echo "=============================================="
              echo "END INVESTIGATION"
              echo "=============================================="
            '


      - name: Inspect npm bundled dependencies
        run: |
          docker run --rm \
            fullstack-devops-portfolio-backend:ci \
            sh -c '
              echo "=============================================="
              echo "NPM BUNDLED DEPENDENCY INVESTIGATION"
              echo "=============================================="

              echo ""
              echo "=== Node ==="
              node --version

              echo ""
              echo "=== npm ==="
              npm --version

              echo ""
              echo "=== npm package ==="
              node -p "require(\"/usr/local/lib/node_modules/npm/package.json\").version"

              echo ""
              echo "=== Vulnerable package versions ==="

              for pkg in brace-expansion picomatch ip-address sigstore tar; do
                echo ""
                echo "PACKAGE: $pkg"

                node -p \
                  "require(\"/usr/local/lib/node_modules/npm/node_modules/$pkg/package.json\").version" \
                  2>/dev/null || echo "Package not found"
              done

              echo ""
              echo "=============================================="
              echo "END NPM INVESTIGATION"
              echo "=============================================="
            '


      # ========================================================
      # FRONTEND CONTAINER
      # ========================================================
      - name: Run frontend container
        run: |
          docker run -d \
            --name frontend-smoke \
            -p 8080:80 \
            fullstack-devops-portfolio-frontend:ci

      - name: Wait for frontend
        run: sleep 5

      - name: Smoke test frontend
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 2 \
            http://localhost:8080

      - name: Remove frontend container
        if: always()
        run: |
          docker rm -f frontend-smoke || true


      # ========================================================
      # BACKEND CONTAINER
      # ========================================================
      - name: Run backend container
        run: |
          docker run -d \
            --name backend-smoke \
            -p 5000:5000 \
            fullstack-devops-portfolio-backend:ci

      - name: Wait for backend
        run: sleep 5

      - name: Smoke test backend
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 2 \
            http://localhost:5000/

      - name: Remove backend container
        if: always()
        run: |
          docker rm -f backend-smoke || true


  # ============================================================
  # DOCKER SECURITY SCANNING
  # ============================================================
  docker-security-scan:
    name: Trivy Docker Security Scan
    runs-on: ubuntu-latest

    needs:
      - docker-smoke-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # BUILD FRONTEND SCAN IMAGE
      # ========================================================
      - name: Build frontend image
        run: |
          docker build \
            -t fullstack-devops-portfolio-frontend:scan \
            ./frontend


      # ========================================================
      # BUILD BACKEND SCAN IMAGE
      # ========================================================
      - name: Build backend image
        run: |
          docker build \
            -t fullstack-devops-portfolio-backend:scan \
            ./backend


      # ========================================================
      # SEARCH ENTIRE BACKEND IMAGE
      # ========================================================
      - name: Search entire backend image for vulnerable packages
        run: |
          docker run --rm \
            fullstack-devops-portfolio-backend:scan \
            sh -c '
              echo "=== SEARCHING ENTIRE IMAGE ==="

              for pkg in brace-expansion picomatch ip-address sigstore tar; do
                echo ""
                echo "=============================================="
                echo "PACKAGE: $pkg"
                echo "=============================================="

                find / \
                  -type d \
                  -name "$pkg" \
                  2>/dev/null || true
              done
            '


      # ========================================================
      # LOCATE PACKAGE.JSON FILES
      # ========================================================
      - name: Locate vulnerable package.json files
        run: |
          docker run --rm \
            fullstack-devops-portfolio-backend:scan \
            sh -c '
              echo "=== VULNERABLE PACKAGE.JSON LOCATIONS ==="

              for pkg in brace-expansion picomatch ip-address sigstore tar; do
                echo ""
                echo "PACKAGE: $pkg"

                find / \
                  -type f \
                  -path "*/$pkg/package.json" \
                  2>/dev/null || true
              done
            '


      # ========================================================
      # TRIVY - FRONTEND
      # ========================================================
      - name: Scan frontend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fullstack-devops-portfolio-frontend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1


      # ========================================================
      # TRIVY - BACKEND
      # ========================================================
      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fullstack-devops-portfolio-backend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          format: json
          output: trivy-backend.json


      # ========================================================
      # PRINT BACKEND VULNERABILITY SUMMARY
      # ========================================================
      - name: Print backend vulnerability summary
        if: always()
        run: |
          echo "=== BACKEND VULNERABILITY SUMMARY ==="

          if [ -f trivy-backend.json ]; then
            jq -r '
              .Results[]?
              | .Vulnerabilities[]?
              | [
                  .VulnerabilityID,
                  .PkgName,
                  .InstalledVersion,
                  .FixedVersion,
                  .Severity,
                  .Title
                ]
              | @tsv
            ' trivy-backend.json
          else
            echo "No Trivy JSON report found."
          fi
